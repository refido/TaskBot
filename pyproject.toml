[project]
name = "taskbot"
version = "1.0.0"
description = "Automate some boring tasks."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.1",
    "opencv-python>=4.11.0.86",
    "pillow>=12.1.0",
    "playwright>=1.57.0",
    "python-dotenv>=1.2.1",
    "python-slugify>=8.0.4",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-base-url>=2.1.0",
    "pytest-playwright>=0.7.2",
]
