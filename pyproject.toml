[project]
name = "taskbot"
version = "1.0.0"
description = "Automate some boring tasks."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.4.1",
    "opencv-python>=4.11.0.86",
    "pillow>=12.1.0",
    "playwright>=1.57.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.0.2",
    "pytest-base-url>=2.1.0",
    "pytest-playwright>=0.7.2",
    "ruff>=0.17.6",
]

[tool.mypy]
python_version = "3.14"
warn_unused_ignores = true
enable_error_code = ["ignore-without-code"]

[[tool.mypy.overrides]]
module = ["psycopg2", "psycopg2.*"]
follow_untyped_imports = true

[tool.ruff.lint.per-file-ignores]
# int(...) around NumPy/OpenCV values deliberately converts them to plain Python ints.
"src/vision/**" = ["RUF046"]
"src/pipelines/slider/**" = ["RUF046"]
